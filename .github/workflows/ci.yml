name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read
  security-events: write

jobs:
  # 1. Lint ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .

  # 2. Unit tests — one job per service ────────────────────────────────────
  unit-tests:
    name: Unit Tests — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - voting-service
          - election-service
          - results-service
          - admin-service
          - frontend-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r ${{ matrix.service }}/requirements.txt -r requirements-dev.txt
      - name: Run unit tests
        run: |
          python -m pytest ${{ matrix.service }}/tests/ \
            -v --tb=short \
            --junitxml=test-results/unit-${{ matrix.service }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-results-${{ matrix.service }}
          path: test-results/unit-${{ matrix.service }}.xml

  # 3. Shared module unit tests ─────────────────────────────────────────────
  unit-tests-shared:
    name: Unit Tests — shared
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install \
            -r shared/requirements.txt \
            -r auth-service/requirements.txt \
            -r requirements-dev.txt
      - name: Run shared tests
        run: |
          python -m pytest tests/test_logging_config.py tests/test_shared.py \
            -v --tb=short \
            --junitxml=test-results/unit-shared.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-results-shared
          path: test-results/unit-shared.xml

  # 4. Integration tests — full stack via Docker Compose ────────────────────
  integration-tests:
    name: Integration Tests (Docker Compose)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose build
      - run: docker compose up -d
      - name: Wait for PostgreSQL
        run: |
          timeout 120 bash -c \
            'until docker compose ps postgres | grep -q "(healthy)"; do sleep 3; done'
      - name: Wait for NGINX
        run: |
          timeout 90 bash -c \
            'until curl -sf http://localhost/ -o /dev/null; do sleep 3; done'
      - name: Wait for auth-service
        run: |
          timeout 90 bash -c \
            'until docker compose exec -T auth-service python3 -c \
              "import urllib.request; urllib.request.urlopen(\"http://localhost:5001/health\")" \
              2>/dev/null; do sleep 3; done'
      - name: Wait for election-service
        run: |
          timeout 90 bash -c \
            'until docker compose exec -T election-service python3 -c \
              "import urllib.request; urllib.request.urlopen(\"http://localhost:5005/health\")" \
              2>/dev/null; do sleep 3; done'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install "httpx==0.27.0" pytest
      - name: Run integration tests
        run: |
          python -m pytest tests/test_integration_compose.py \
            -v --tb=short \
            --junitxml=test-results/integration.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: test-results/integration.xml
      - if: failure()
        run: docker compose logs --tail=50
      - if: always()
        run: docker compose down -v

  # 5. Docker build verification ─────────────────────────────────────────────
  build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [unit-tests, unit-tests-shared]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose build

  # 6. Trivy image scan ──────────────────────────────────────────────────────
  trivy:
    name: Trivy — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            image: u-vote-auth-service
          - service: admin-service
            image: u-vote-admin-service
          - service: voting-service
            image: u-vote-voting-service
          - service: results-service
            image: u-vote-results-service
          - service: election-service
            image: u-vote-election-service
          - service: frontend-service
            image: u-vote-frontend-service
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose build ${{ matrix.service }}
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.image }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
        continue-on-error: true
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

  # 7. Trivy filesystem scan ─────────────────────────────────────────────────
  trivy-fs:
    name: Trivy — filesystem
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-filesystem

  # ── STAGING DEPLOYMENT (staging branch — auto-deploys on push) ───────────

  # 8. Push images to ECR (staging) ─────────────────────────────────────────
  push-images-staging:
    name: Push — ${{ matrix.service }} (staging)
    runs-on: ubuntu-latest
    needs: [trivy, trivy-fs, integration-tests]
    if: github.ref == 'refs/heads/staging'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            dockerfile: auth-service/Dockerfile
          - service: admin-service
            dockerfile: admin-service/Dockerfile
          - service: voting-service
            dockerfile: voting-service/Dockerfile
          - service: results-service
            dockerfile: results-service/Dockerfile
          - service: election-service
            dockerfile: election-service/Dockerfile
          - service: frontend-service
            dockerfile: frontend-service/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
      - name: Set short SHA
        run: echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV
      - name: Build and push ${{ matrix.service }}
        env:
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/uvote/${{ matrix.service }}:latest
            ${{ env.ECR_REGISTRY }}/uvote/${{ matrix.service }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/uvote/${{ matrix.service }}:${{ env.SHORT_SHA }}

  # 9. Update staging Kustomize image tags ──────────────────────────────────
  update-staging-manifests:
    name: Update staging image tags
    runs-on: ubuntu-latest
    needs: push-images-staging
    if: github.ref == 'refs/heads/staging'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Stamp new SHA into staging kustomization
        env:
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          OVERLAY=uvote-platform/k8s/overlays/staging/kustomization.yaml
          for svc in auth admin voting results election frontend; do
            sed -i "s|newTag: .*  # ${svc}-service|newTag: \"${SHORT_SHA}\"  # ${svc}-service|g" $OVERLAY
          done
          # Fallback: update all newTag lines uniformly
          sed -i "s/newTag: \"[a-f0-9]*\"/newTag: \"${SHORT_SHA}\"/g" $OVERLAY
      - name: Commit and push
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add uvote-platform/k8s/overlays/staging/kustomization.yaml
          git diff --staged --quiet \
            && echo "No tag changes to commit" \
            || (git commit -m "chore(staging): update image tags to ${SHORT_SHA} [skip ci]" \
                && git push origin staging)

  # ── k6 SMOKE GATE — required check on PRs to main ────────────────────────

  # 10. k6 smoke test against live staging (runs on PRs to main) ───────────
  k6-gate:
    name: "Gate: k6 smoke test (staging)"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v4
      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6
      - name: Run k6 smoke test against staging
        env:
          K6_STAGING_URL: ${{ vars.STAGING_URL }}
        run: k6 run tests/k6/smoke.js

  # ── PRODUCTION DEPLOYMENT (main branch only) ─────────────────────────────

  # 11. Manual gate — production deploy approval ────────────────────────────
  production-gate:
    name: "Gate: Approve production deploy"
    runs-on: ubuntu-latest
    needs: [trivy, trivy-fs, integration-tests]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - run: echo "Production deploy approved — proceeding to push images"

  # 12. Push images to ECR (production) ────────────────────────────────────
  push-images-production:
    name: Push — ${{ matrix.service }} (production)
    runs-on: ubuntu-latest
    needs: production-gate
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            dockerfile: auth-service/Dockerfile
          - service: admin-service
            dockerfile: admin-service/Dockerfile
          - service: voting-service
            dockerfile: voting-service/Dockerfile
          - service: results-service
            dockerfile: results-service/Dockerfile
          - service: election-service
            dockerfile: election-service/Dockerfile
          - service: frontend-service
            dockerfile: frontend-service/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
      - name: Set short SHA
        run: echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV
      - name: Build and push ${{ matrix.service }}
        env:
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/uvote/${{ matrix.service }}:latest
            ${{ env.ECR_REGISTRY }}/uvote/${{ matrix.service }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/uvote/${{ matrix.service }}:${{ env.SHORT_SHA }}

  # 13. Update production Kustomize image tags ──────────────────────────────
  update-production-manifests:
    name: Update production image tags
    runs-on: ubuntu-latest
    needs: push-images-production
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Stamp new SHA into production kustomization
        env:
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          OVERLAY=uvote-platform/k8s/overlays/production/kustomization.yaml
          sed -i "s/newTag: \"[a-f0-9]*\"/newTag: \"${SHORT_SHA}\"/g" $OVERLAY
      - name: Commit and push
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add uvote-platform/k8s/overlays/production/kustomization.yaml
          git diff --staged --quiet \
            && echo "No tag changes to commit" \
            || (git commit -m "chore(prod): update image tags to ${SHORT_SHA} [skip ci]" \
                && git push origin main)
