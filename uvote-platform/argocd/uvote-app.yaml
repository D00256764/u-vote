# Deprecated — use uvote-platform/k8s/argocd/application.yaml (multi-source: k8s + istio).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: uvote
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: https://github.com/D00256764/u-vote
      targetRevision: main
      path: uvote-platform/k8s
      directory:
        recurse: true
    - repoURL: https://github.com/D00256764/u-vote
      targetRevision: main
      path: uvote-platform/istio
      directory:
        recurse: false

  destination:
    server: https://kubernetes.default.svc
    namespace: uvote-dev

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
