# Staging Istio — port 80, fully-qualified gateway and service hosts (avoids cross-namespace bleed).
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: uvote-gateway
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http-staging
        protocol: HTTP
      hosts:
        - "*"

---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: uvote-auth
spec:
  hosts:
    - "*"
  gateways:
    - uvote-dev/uvote-gateway
  http:
    - match:
        - uri:
            prefix: /api/auth
      route:
        - destination:
            host: auth-service.uvote-dev.svc.cluster.local
            port:
              number: 5001
      timeout: 10s
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: gateway-error,connect-failure,retriable-4xx

---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: uvote-elections
spec:
  hosts:
    - "*"
  gateways:
    - uvote-dev/uvote-gateway
  http:
    - match:
        - uri:
            prefix: /dashboard
      route:
        - destination:
            host: election-service.uvote-dev.svc.cluster.local
            port:
              number: 5005
      timeout: 15s
    - match:
        - uri:
            regex: ^/elections/[0-9]+/results.*
      route:
        - destination:
            host: results-service.uvote-dev.svc.cluster.local
            port:
              number: 5004
      timeout: 10s
    - match:
        - uri:
            regex: ^/elections/[0-9]+/(voters|tokens).*
      route:
        - destination:
            host: admin-service.uvote-dev.svc.cluster.local
            port:
              number: 5002
      timeout: 10s
    - match:
        - uri:
            prefix: /elections
      route:
        - destination:
            host: election-service.uvote-dev.svc.cluster.local
            port:
              number: 5005
      timeout: 15s
    - match:
        - uri:
            prefix: /api/elections
      route:
        - destination:
            host: election-service.uvote-dev.svc.cluster.local
            port:
              number: 5005
      timeout: 15s

---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: uvote-voting
spec:
  hosts:
    - "*"
  gateways:
    - uvote-dev/uvote-gateway
  http:
    - match:
        - uri:
            prefix: /vote
      route:
        - destination:
            host: voting-service.uvote-dev.svc.cluster.local
            port:
              number: 5003
      timeout: 15s
    - match:
        - uri:
            prefix: /receipt
      route:
        - destination:
            host: voting-service.uvote-dev.svc.cluster.local
            port:
              number: 5003
      timeout: 15s
    - match:
        - uri:
            prefix: /api/voting
      route:
        - destination:
            host: voting-service.uvote-dev.svc.cluster.local
            port:
              number: 5003
      timeout: 15s

---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: uvote-results
spec:
  hosts:
    - "*"
  gateways:
    - uvote-dev/uvote-gateway
  http:
    - match:
        - uri:
            prefix: /api/results
      route:
        - destination:
            host: results-service.uvote-dev.svc.cluster.local
            port:
              number: 5004
      timeout: 10s

---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: uvote-admin
spec:
  hosts:
    - "*"
  gateways:
    - uvote-dev/uvote-gateway
  http:
    - match:
        - uri:
            prefix: /api/admin
      route:
        - destination:
            host: admin-service.uvote-dev.svc.cluster.local
            port:
              number: 5002
      timeout: 10s

---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: uvote-frontend
spec:
  hosts:
    - "*"
  gateways:
    - uvote-dev/uvote-gateway
  http:
    - name: primary
      match:
        - uri:
            prefix: /
      route:
        - destination:
            host: frontend-service.uvote-dev.svc.cluster.local
            subset: stable
            port:
              number: 5000
          weight: 100
        - destination:
            host: frontend-service.uvote-dev.svc.cluster.local
            subset: canary
            port:
              number: 5000
          weight: 0
      timeout: 10s

---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: frontend-service
spec:
  host: frontend-service.uvote-dev.svc.cluster.local
  subsets:
    - name: stable
    - name: canary
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL

---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: auth-service
spec:
  host: auth-service.uvote-dev.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL

---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: election-service
spec:
  host: election-service.uvote-dev.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL

---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: voting-service
spec:
  host: voting-service.uvote-dev.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL

---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: results-service
spec:
  host: results-service.uvote-dev.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL

---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: admin-service
spec:
  host: admin-service.uvote-dev.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
