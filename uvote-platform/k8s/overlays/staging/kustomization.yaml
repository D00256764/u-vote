apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: uvote-dev

resources:
  - ../../base
  - secrets.yaml
  - istio.yaml

patches:
  - path: url-env-patch.yaml
    target:
      kind: Deployment
      name: election-service
  - path: url-env-admin-patch.yaml
    target:
      kind: Deployment
      name: admin-service
  - path: url-env-results-patch.yaml
    target:
      kind: Deployment
      name: results-service
  - path: frontend-rollout-steps.jsonpatch.yaml
    target:
      kind: Rollout
      name: frontend-service
  - path: analysis-template-patch.jsonpatch.yaml
    target:
      kind: AnalysisTemplate
      name: frontend-success-rate
  # Lenient outlier detection — single auth pod must not be ejected on restart blips
  - path: auth-service-outlier-patch.yaml
    target:
      kind: DestinationRule
      name: auth-service
  # Expose monitoring via NodePort for easy dev access (prod uses ClusterIP)
  - path: prometheus-nodeport-patch.yaml
    target:
      kind: Service
      name: prometheus
  - path: grafana-nodeport-patch.yaml
    target:
      kind: Service
      name: grafana

# Image tags — updated by CI update-manifests job on staging push.
# Use full ECR repo path so the transformer matches Rollout CRDs (not only Deployments).
images:
  - name: 484010150615.dkr.ecr.eu-west-1.amazonaws.com/uvote/auth-service
    newName: 484010150615.dkr.ecr.eu-west-1.amazonaws.com/uvote/auth-service
    newTag: "e95e42a"
  - name: 484010150615.dkr.ecr.eu-west-1.amazonaws.com/uvote/admin-service
    newName: 484010150615.dkr.ecr.eu-west-1.amazonaws.com/uvote/admin-service
    newTag: "e95e42a"
  - name: 484010150615.dkr.ecr.eu-west-1.amazonaws.com/uvote/voting-service
    newName: 484010150615.dkr.ecr.eu-west-1.amazonaws.com/uvote/voting-service
    newTag: "e95e42a"
  - name: 484010150615.dkr.ecr.eu-west-1.amazonaws.com/uvote/results-service
    newName: 484010150615.dkr.ecr.eu-west-1.amazonaws.com/uvote/results-service
    newTag: "e95e42a"
  - name: 484010150615.dkr.ecr.eu-west-1.amazonaws.com/uvote/election-service
    newName: 484010150615.dkr.ecr.eu-west-1.amazonaws.com/uvote/election-service
    newTag: "e95e42a"
  - name: 484010150615.dkr.ecr.eu-west-1.amazonaws.com/uvote/frontend-service
    newName: 484010150615.dkr.ecr.eu-west-1.amazonaws.com/uvote/frontend-service
    newTag: "e95e42a"
