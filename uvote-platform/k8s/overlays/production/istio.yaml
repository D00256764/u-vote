            prefix: /api/results
      route:
        - destination:
            host: results-service
            port:
              number: 5004
      timeout: 10s
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: gateway-error,connect-failure,retriable-4xx

---
apiVersion: networking.istio.io/v1beta1
