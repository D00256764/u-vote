apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: uvote-gateway
  namespace: uvote-prod
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 8080
        name: http-prod
        protocol: HTTP
      hosts:
        - "*"

---
# Auth service — JWT login/register/verify
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: uvote-auth
  namespace: uvote-prod
spec:
  hosts:
    - "*"
  gateways:
    - uvote-prod/uvote-gateway
  http:
    - match:
        - uri:
            prefix: /api/auth
      route:
        - destination:
            host: auth-service.uvote-prod.svc.cluster.local
            port:
              number: 5001
      timeout: 10s
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: gateway-error,connect-failure,retriable-4xx

---
# Election service — dashboard, elections CRUD, results sub-paths, admin sub-paths
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: uvote-elections
  namespace: uvote-prod
spec:
  hosts:
    - "*"
  gateways:
    - uvote-prod/uvote-gateway
  http:
    - match:
        - uri:
            prefix: /dashboard
      route:
        - destination:
            host: election-service.uvote-prod.svc.cluster.local
            port:
              number: 5005
      timeout: 15s
      retries:
        attempts: 3
        perTryTimeout: 3s
        retryOn: gateway-error,connect-failure,retriable-4xx
    - match:
        - uri:
            regex: ^/elections/[0-9]+/results.*
      route:
        - destination:
            host: results-service.uvote-prod.svc.cluster.local
            port:
              number: 5004
      timeout: 10s
    - match:
        - uri:
            regex: ^/elections/[0-9]+/(voters|tokens).*
      route:
        - destination:
            host: admin-service.uvote-prod.svc.cluster.local
            port:
              number: 5002
      timeout: 10s
    - match:
        - uri:
            prefix: /elections
      route:
        - destination:
            host: election-service.uvote-prod.svc.cluster.local
            port:
              number: 5005
      timeout: 15s
      retries:
        attempts: 3
        perTryTimeout: 3s
        retryOn: gateway-error,connect-failure,retriable-4xx
    - match:
        - uri:
            prefix: /api/elections
      route:
        - destination:
            host: election-service.uvote-prod.svc.cluster.local
            port:
              number: 5005
      timeout: 15s

---
# Voting service — vote submission and receipt
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: uvote-voting
  namespace: uvote-prod
spec:
  hosts:
    - "*"
  gateways:
    - uvote-prod/uvote-gateway
  http:
    - match:
        - uri:
            prefix: /vote
      route:
        - destination:
            host: voting-service.uvote-prod.svc.cluster.local
            port:
              number: 5003
      timeout: 15s
      retries:
        attempts: 3
        perTryTimeout: 3s
        retryOn: gateway-error,connect-failure,retriable-4xx
    - match:
        - uri:
            prefix: /receipt
      route:
        - destination:
            host: voting-service.uvote-prod.svc.cluster.local
            port:
              number: 5003
      timeout: 15s
    - match:
        - uri:
            prefix: /api/voting
      route:
        - destination:
            host: voting-service.uvote-prod.svc.cluster.local
            port:
              number: 5003
      timeout: 15s

---
# Results service — API path only (direct results paths handled in elections VS)
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: uvote-results
  namespace: uvote-prod
spec:
  hosts:
    - "*"
  gateways:
    - uvote-prod/uvote-gateway
  http:
    - match:
        - uri:
            prefix: /api/results
      route:
        - destination:
            host: results-service.uvote-prod.svc.cluster.local
            port:
              number: 5004
      timeout: 10s
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: gateway-error,connect-failure,retriable-4xx

---
# Admin service
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: uvote-admin
  namespace: uvote-prod
spec:
  hosts:
    - "*"
  gateways:
    - uvote-prod/uvote-gateway
  http:
    - match:
        - uri:
            prefix: /api/admin
      route:
        - destination:
            host: admin-service.uvote-prod.svc.cluster.local
            port:
              number: 5002
      timeout: 10s
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: gateway-error,connect-failure,retriable-4xx

---
# Frontend — catch-all, must be last
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: uvote-frontend
  namespace: uvote-prod
spec:
  hosts:
    - "*"
  gateways:
    - uvote-prod/uvote-gateway
  http:
    - name: primary
      match:
        - uri:
            prefix: /
      route:
        - destination:
            host: frontend-service.uvote-prod.svc.cluster.local
            subset: stable
            port:
              number: 5000
          weight: 100
        - destination:
            host: frontend-service.uvote-prod.svc.cluster.local
            subset: canary
            port:
              number: 5000
          weight: 0
      timeout: 10s
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: gateway-error,connect-failure,retriable-4xx

---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: frontend-service
  namespace: uvote-prod
spec:
  host: frontend-service.uvote-prod.svc.cluster.local
  subsets:
    - name: stable
    - name: canary
  trafficPolicy:
    connectionPool:
      http:
        http1MaxPendingRequests: 100
        http2MaxRequests: 1000
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 30s
      baseEjectionTime: 30s
    tls:
      mode: ISTIO_MUTUAL

