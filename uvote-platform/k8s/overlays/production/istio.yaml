apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: uvote-gateway
  namespace: uvote-prod
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 8080
        name: http-prod
        protocol: HTTP
      hosts:
        - "*"

---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: uvote-auth
  namespace: uvote-prod
spec:
  hosts:
    - "*"
  gateways:
    - uvote-gateway
  http:
    - match:
        - uri:
            prefix: /api/auth
      route:
        - destination:
            host: auth-service
            port:
              number: 5001
      timeout: 10s
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: gateway-error,connect-failure,retriable-4xx

---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: uvote-elections
  namespace: uvote-prod
spec:
  hosts:
    - "*"
  gateways:
    - uvote-gateway
  http:
    - match:
        - uri:
            prefix: /api/elections
      route:
        - destination:
            host: election-service
            port:
              number: 5005
      timeout: 10s
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: gateway-error,connect-failure,retriable-4xx

---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: uvote-voting
  namespace: uvote-prod
spec:
  hosts:
    - "*"
  gateways:
    - uvote-gateway
  http:
    - match:
        - method:
            exact: POST
          uri:
            prefix: /vote/submit
      route:
        - destination:
            host: voting-service
            port:
              number: 5003
      timeout: 15s
    - match:
        - uri:
            prefix: /api/voting
      route:
        - destination:
            host: voting-service
            port:
              number: 5003
      timeout: 15s
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: gateway-error,connect-failure,retriable-4xx

---
apiVersion: networking.istio.io/v1beta1
