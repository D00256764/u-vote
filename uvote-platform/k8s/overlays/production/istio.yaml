---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: uvote-frontend
  namespace: uvote-prod
spec:
  hosts:
    - "*"
  gateways:
    - uvote-gateway
  http:
    - name: primary
      match:
        - uri:
            prefix: /
      route:
        - destination:
            host: frontend-service
            subset: stable
            port:
              number: 5000
          weight: 100
        - destination:
            host: frontend-service
            subset: canary
            port:
              number: 5000
          weight: 0
      timeout: 10s
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: gateway-error,connect-failure,retriable-4xx

---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: frontend-service
  namespace: uvote-prod
spec:
  host: frontend-service
  subsets:
    - name: stable
    - name: canary
  trafficPolicy:
    connectionPool:
      http:
        http1MaxPendingRequests: 100
        http2MaxRequests: 1000
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 30s
      baseEjectionTime: 30s
    tls:
      mode: ISTIO_MUTUAL

---
apiVersion: networking.istio.io/v1beta1
