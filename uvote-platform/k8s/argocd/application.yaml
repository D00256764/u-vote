# Staging ArgoCD Application
# Watches staging branch → deploys to uvote-dev (staging)
#
# Bootstrap (once per cluster):
#   kubectl apply -n argocd -f uvote-platform/k8s/argocd/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: uvote-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/D00256764/u-vote
    targetRevision: staging
    path: uvote-platform/k8s/overlays/staging

  destination:
    server: https://kubernetes.default.svc
    namespace: uvote-dev

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true

  ignoreDifferences:
    - group: networking.istio.io
      kind: VirtualService
      name: uvote-frontend
      jsonPointers:
        - /spec/http/0/route/0/weight
        - /spec/http/0/route/1/weight
    - group: networking.istio.io
      kind: VirtualService
      jqPathExpressions:
        - .spec.http[]?.route[]?.weight
