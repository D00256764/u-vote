# Bootstrap (once per cluster):
#   kubectl create namespace argocd
#   kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
#   kubectl apply -n argocd -f uvote-platform/k8s/argocd/application.yaml
#   kubectl apply -n argocd -f uvote-platform/k8s/argocd/rollouts-controller.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: uvote-platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/D00256764/u-vote
    targetRevision: main
    path: uvote-platform/k8s
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: uvote-dev

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
