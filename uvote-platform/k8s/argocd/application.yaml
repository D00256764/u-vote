# Bootstrap (once per cluster):
#   kubectl create namespace argocd
#   kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
#   kubectl apply -n argocd -f uvote-platform/k8s/argocd/application.yaml
#   kubectl apply -n argocd -f uvote-platform/k8s/argocd/rollouts-controller.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: uvote-platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  sources:
    - repoURL: https://github.com/D00256764/u-vote
      targetRevision: main
      path: uvote-platform/k8s
      directory:
        recurse: true
    - repoURL: https://github.com/D00256764/u-vote
      targetRevision: main
      path: uvote-platform/istio
      directory:
        recurse: false

  destination:
    server: https://kubernetes.default.svc
    namespace: uvote-dev

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true

  ignoreDifferences:
    # Rollout controller owns VirtualService weights during canary.
    - group: networking.istio.io
      kind: VirtualService
      name: uvote-frontend
      jsonPointers:
        - /spec/http/0/route/0/weight
        - /spec/http/0/route/1/weight
