# Production ArgoCD Application
# Watches main branch → deploys to uvote-prod via Argo Rollouts canary
#
# Bootstrap (once per cluster):
#   kubectl apply -n argocd -f uvote-platform/k8s/argocd/prod-application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: uvote-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/D00256764/u-vote
    targetRevision: main
    path: uvote-platform/k8s/overlays/production

  destination:
    server: https://kubernetes.default.svc
    namespace: uvote-prod

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true

  ignoreDifferences:
    - group: networking.istio.io
      kind: VirtualService
      name: uvote-frontend
      jsonPointers:
        - /spec/http/0/route/0/weight
        - /spec/http/0/route/1/weight
