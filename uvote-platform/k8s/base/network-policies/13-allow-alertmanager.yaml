# AlertManager: accept alerts from Prometheus, send notifications to Slack
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alertmanager-ingress-from-prometheus
  labels:
    app: uvote
    security: network-policy
    purpose: observability
    policy-order: "13"
spec:
  podSelector:
    matchLabels:
      app: alertmanager
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: prometheus
    ports:
    - port: 9093
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alertmanager-egress
  labels:
    app: uvote
    security: network-policy
    purpose: observability
    policy-order: "13"
spec:
  podSelector:
    matchLabels:
      app: alertmanager
  policyTypes:
  - Egress
  egress:
  # Allow outbound HTTPS to Slack (hooks.slack.com)
  - ports:
    - port: 443
      protocol: TCP
  # Allow DNS resolution
  - to:
    - namespaceSelector: {}
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
