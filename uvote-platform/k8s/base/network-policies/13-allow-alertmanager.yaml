# Alertmanager: receive alerts from Prometheus, send notifications to Slack (HTTPS).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-to-alertmanager
  labels:
    app: uvote
    security: network-policy
    purpose: observability
    policy-order: "13"
spec:
  podSelector:
    matchLabels:
      app: alertmanager
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - port: 9093
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alertmanager-egress
  labels:
    app: uvote
    security: network-policy
    purpose: observability
    policy-order: "13"
spec:
  podSelector:
    matchLabels:
      app: alertmanager
  policyTypes:
    - Egress
  egress:
    # Slack incoming webhooks (hooks.slack.com:443)
    - ports:
        - port: 443
          protocol: TCP
---
apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: slack-webhooks
  labels:
    app: uvote
    purpose: observability
spec:
  hosts:
    - hooks.slack.com
  ports:
    - number: 443
      name: https
      protocol: HTTPS
  location: MESH_EXTERNAL
  resolution: DNS
