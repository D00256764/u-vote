apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: frontend-success-rate
  namespace: uvote-dev
spec:
  metrics:
    - name: error-rate
      interval: 1m
      count: 5
      successCondition: result[0] < 0.05
      failureLimit: 2
      provider:
        prometheus:
          address: http://prometheus:9090
          query: |
            (
              sum(rate(http_requests_total{job="frontend-service",status=~"5.."}[2m]))
              /
              clamp_min(sum(rate(http_requests_total{job="frontend-service"}[2m])), 0.001)
            )
