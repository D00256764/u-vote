# Legacy manual install — prefer overlays/staging/istio.yaml via Argo CD.
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: auth-service
  namespace: uvote-dev
spec:
  host: auth-service.uvote-dev.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL

