apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: uvote-auth
  namespace: uvote-dev
spec:
  hosts:
  - "*"
  gateways:
  - uvote-gateway
  http:
  - match:
    - uri:
        prefix: /api/auth
    route:
    - destination:
        host: auth-service
        port:
          number: 5001
    timeout: 10s
    retries:
      attempts: 3
      perTryTimeout: 2s
      retryOn: gateway-error,connect-failure,retriable-4xx

---

