# Legacy manual install — prefer overlays/staging/istio.yaml via Argo CD (FQDN routes).
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: uvote-auth
  namespace: uvote-dev
spec:
  hosts:
  - "*"
  gateways:
  - uvote-dev/uvote-gateway
  http:
  - match:
    - uri:
        prefix: /api/auth
    route:
    - destination:
        host: auth-service.uvote-dev.svc.cluster.local
        port:
          number: 5001
    timeout: 10s

