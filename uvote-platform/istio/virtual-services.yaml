---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: uvote-frontend
  namespace: uvote-dev
spec:
  hosts:
  - "*"
  gateways:
  - uvote-dev/uvote-gateway
  http:
  - name: primary
    match:
    - uri:
        prefix: /
    route:
    - destination:
        host: frontend-service.uvote-dev.svc.cluster.local
        subset: stable
        port:
          number: 5000
      weight: 100
    - destination:
        host: frontend-service.uvote-dev.svc.cluster.local
        subset: canary
        port:
          number: 5000
      weight: 0
    timeout: 10s
