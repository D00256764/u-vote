---

apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: uvote-voting
  namespace: uvote-dev
spec:
  hosts:
  - "*"
  gateways:
  - uvote-gateway
  http:
  - match:
    - method:
        exact: POST
      uri:
        prefix: /vote/submit
    route:
    - destination:
        host: voting-service
        port:
          number: 5003
    timeout: 15s
  - match:
    - uri:
        prefix: /api/voting
    route:
    - destination:
        host: voting-service
        port:
          number: 5003
    timeout: 15s
    retries:
      attempts: 3
      perTryTimeout: 2s
      retryOn: gateway-error,connect-failure,retriable-4xx

